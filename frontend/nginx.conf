server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /events/stream {
        proxy_pass              https://realtime-dashboard-backend-947o.onrender.com;
        proxy_http_version      1.1;
        proxy_set_header        Host realtime-dashboard-backend-947o.onrender.com;
        proxy_ssl_server_name   on;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      86400s;
        chunked_transfer_encoding on;
        proxy_set_header        X-Accel-Buffering no;
        gzip                    off;
    }

    location ~ ^/(webhook|events|health|simulate) {
        proxy_pass              https://realtime-dashboard-backend-947o.onrender.com;
        proxy_http_version      1.1;
        proxy_set_header        Host realtime-dashboard-backend-947o.onrender.com;
        proxy_ssl_server_name   on;
        proxy_set_header        X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}