services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      # Set a secret so only your Cloud Connector rule can post events.
      # Cloud Connector → Headers → Authorization: Bearer <your-secret>
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      MAX_EVENTS: ${MAX_EVENTS:-1000}
    ports:
      # Expose directly for local dev / ngrok tunnelling
      - "${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
